name: Apply participant notes feedback

on:
  push:
    branches:
      - fix/participant-notes-workflow
    paths:
      - scripts/apply-participant-notes-feedback.mjs
      - .github/workflows/apply-participant-notes-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feedback branch
        uses: actions/checkout@v4
        with:
          ref: fix/participant-notes-workflow
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply feedback patch
        run: node scripts/apply-participant-notes-feedback.mjs
      - name: Run focused regressions
        run: |
          node tests/check-in.test.mjs
          node tests/registration.test.mjs
          node tests/event-info.test.mjs
          node tests/guide.test.mjs
          node tests/html-escaping.test.mjs
          node tests/admin-privacy-transition.test.mjs
          npm run check:architecture
          node scripts/test-fast.mjs
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/tournament/factory.js src/domain/tournament/lifecycle.js src/domain/tournament/registration.js src/views/manage.js src/views/schedule/participant-panels.js src/features/schedule/controller.js src/views/registration.js src/views/registration-admin.js src/views/guide.js src/styles/features/tournament-management.css tests/check-in.test.mjs tests/event-info.test.mjs tests/registration.test.mjs tests/guide.test.mjs tests/full-flow.test.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: prioritize participant notes workflow"
            git push origin HEAD:fix/participant-notes-workflow
          fi
