name: Temporary Buchholz integration

on:
  push:
    branches:
      - feat/buchholz-ranking-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: feat/buchholz-ranking-v1
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply integration patch
        run: python3 scripts/tmp-buchholz-patch.py
      - name: Focused ranking tests
        run: node tests/swiss-ranking.test.mjs
      - name: Fast regression
        run: node scripts/test-fast.mjs
      - name: Full browser regression
        run: node scripts/test-full.mjs --browser=required
      - name: Remove temporary files
        run: rm -f scripts/tmp-buchholz-patch.py .github/workflows/tmp-buchholz-integration.yml
      - name: Commit tested changes
        run: |
          git config user.name "ckvs4517"
          git config user.email "72429334+ckvs4517@users.noreply.github.com"
          git add -A
          git commit -m "Add versioned Buchholz Swiss ranking"
          git push origin HEAD:feat/buchholz-ranking-v1
