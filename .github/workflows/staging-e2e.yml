# 手動執行真正的 spin-league-test UI + Test D1 E2E；嚴禁正式站。
name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '測試站已部署的 Git SHA（7～40 碼）；release acceptance 必須精確指定版本'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spin-league-staging-e2e
  cancel-in-progress: false

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_SITE_URL: https://spin-league-test.ckvs4517.chatgpt.site/
      STAGING_ADMIN_PIN: ${{ secrets.STAGING_ADMIN_PIN }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Require staging release inputs
        shell: bash
        run: |
          if [ -z "${STAGING_ADMIN_PIN}" ]; then
            echo "Missing repository secret STAGING_ADMIN_PIN."
            exit 1
          fi
          if ! [[ "${EXPECTED_GIT_SHA}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "expected_sha is required and must be a 7-40 character Git SHA."
            exit 1
          fi

      - name: Run live staging browser E2E
        run: node scripts/verify-staging-browser-e2e.mjs "$STAGING_SITE_URL"

      - name: Save E2E report and failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-${{ github.run_id }}
          path: |
            artifacts/staging-e2e-report.json
            artifacts/staging-e2e-failure.png
          if-no-files-found: warn
          retention-days: 14
