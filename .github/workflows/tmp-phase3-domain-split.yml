name: Phase 3 tournament domain split
on:
  push:
    branches: [v2/codebase-refactor]
permissions:
  contents: write
jobs:
  split:
    if: github.event.head_commit.message == 'Retry Phase 3 tournament domain split'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2/codebase-refactor
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Rebuild and run Phase 3 split
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 2f669d0b7ec8ead61e2f0d44813b9808f43c8199 --depth=1
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          raw = subprocess.check_output([
            'git', 'show', '2f669d0b7ec8ead61e2f0d44813b9808f43c8199:.github/workflows/tmp-phase3-domain-split.yml'
          ], text=True)
          marker = "          python3 - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          script = textwrap.dedent(raw[start:end])
          old = "import { SWISS_RANKING_RULE_LEGACY, normalizeSwissRankingRule } from '../ranking/swiss-ranking.js';"
          new = "import { DEFAULT_SWISS_RANKING_RULE, SWISS_RANKING_RULE_LEGACY, normalizeSwissRankingRule } from '../ranking/swiss-ranking.js';"
          assert old in script
          script = script.replace(old, new, 1)
          Path('/tmp/phase3-split.py').write_text(script)
          PY
          python3 /tmp/phase3-split.py
          node --check src/domain/tournament.js
          for file in src/domain/tournament/*.js; do node --check "$file"; done
          node tests/v2-domain-boundary.test.mjs
          node scripts/test-fast.mjs
          node scripts/test-full.mjs --browser=required
      - name: Commit Phase 3 split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase3-domain-split.yml
          git add src/domain/tournament.js src/domain/tournament tests/v2-domain-boundary.test.mjs scripts/test-fast.mjs
          git commit -m "Decompose tournament domain for V2 Phase 3"
          git push origin HEAD:v2/codebase-refactor
