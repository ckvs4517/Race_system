name: Fix shared capacity UI

on:
  push:
    branches: [feature/48-player-tournaments]
    paths:
      - .github/workflows/fix-shared-capacity-ui.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/48-player-tournaments
      - name: Replace remaining quick-registration cap
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, got {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/views/schedule.js',
              "import { buildRounds, getSwissPhaseStandings, getTournamentStandings } from '../domain/tournament.js';",
              "import { MAX_TOURNAMENT_PLAYERS, buildRounds, getSwissPhaseStandings, getTournamentStandings } from '../domain/tournament.js';",
          )
          replace(
              'src/views/schedule.js',
              '  const capacity = Math.max(tournament.players.length, Number(settings.capacity) || 32);',
              '  const capacity = Math.max(tournament.players.length, Number(settings.capacity) || MAX_TOURNAMENT_PLAYERS);',
          )
          replace(
              'src/views/schedule.js',
              'max="32" value="${capacity}" required>',
              'max="${MAX_TOURNAMENT_PLAYERS}" value="${capacity}" required>',
          )
          replace(
              'tests/check-in.test.mjs',
              "assert.match(view, /建立私密填寫連結/);",
              "assert.match(view, /建立私密填寫連結/);\nassert.match(view, new RegExp(`max=\\\"${MAX_TOURNAMENT_PLAYERS}\\\"`), '賽事頁快速報名設定沿用共用人數上限');",
          )

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/schedule.js tests/check-in.test.mjs
          git diff --cached --check
          git commit -m "fix: use shared player limit in quick registration"
          git push origin HEAD:feature/48-player-tournaments
