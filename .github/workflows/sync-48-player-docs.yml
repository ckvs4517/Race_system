name: Sync 48-player documentation

on:
  push:
    branches: [feature/48-player-tournaments]
    paths:
      - .github/workflows/sync-48-player-docs.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/48-player-tournaments
      - name: Update documentation limits
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {text.count(old)} for {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('README.md', '- 支援 2～32 位已報到選手', '- 支援 2～48 位已報到選手')
          replace('README.md', '- 支援 4～32 位已報到選手', '- 支援 4～48 位已報到選手')
          replace('DEVELOPMENT.md', '    capacity: 32,', '    capacity: 48,')
          replace('DEVELOPMENT.md', '- 2～32 人單淘汰', '- 2～48 人單淘汰')
          replace('DEVELOPMENT.md', '- 4～32 人新版瑞士制', '- 4～48 人新版瑞士制')
          replace('DEVELOPMENT.md', '- 合計 60 場模擬賽事', '- 合計 92 場模擬賽事')
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md DEVELOPMENT.md
          git diff --cached --check
          git commit -m "docs: document 48-player tournament support"
          git push origin HEAD:feature/48-player-tournaments
