name: Tournament date order patch

on:
  push:
    branches:
      - fix/tournament-date-order
    paths:
      - .github/workflows/fix-tournament-date-order.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/tournament-date-order
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Fix legacy tournament date parsing
        run: python3 scripts/tmp-fix-tournament-date-order.py
      - name: Focused event-info regression
        run: node tests/event-info.test.mjs
      - name: Fast regression
        run: node scripts/test-fast.mjs
      - name: Full regression and browser flows
        run: node scripts/test-full.mjs --browser=required
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/schedule.js tests/event-info.test.mjs
          git diff --cached --check
          git commit -m "Normalize tournament dates for recent lists"
          git push origin HEAD:fix/tournament-date-order
