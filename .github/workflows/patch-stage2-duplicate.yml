name: Preserve stage2 config on duplicate

on:
  push:
    branches: [feat/two-stage-swiss]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Preserve stage2 config when duplicating tournaments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/two-stage-swiss
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Patch duplicateTournament
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/domain/tournament.js')
          text = p.read_text(encoding='utf-8')
          old = """export function duplicateTournament(tournament) {
            const normalized = normalizeTournament(tournament);
            return {
              ...createTournament(`${normalized.name}（副本）`, normalized.players, normalized.format, normalized.arenaCount, normalized.eventInfo, normalized.drinkSettings),
              participantDetails: normalizeParticipantDetails(normalized.players, normalized.participantDetails),
            };
          }
          """
          new = """export function duplicateTournament(tournament) {
            const normalized = normalizeTournament(tournament);
            const duplicated = {
              ...createTournament(`${normalized.name}（副本）`, normalized.players, normalized.format, normalized.arenaCount, normalized.eventInfo, normalized.drinkSettings),
              participantDetails: normalizeParticipantDetails(normalized.players, normalized.participantDetails),
            };
            if (normalized.format === 'swiss' && normalized.swissStage2Config) {
              duplicated.swissStage2Config = structuredClone(normalized.swissStage2Config);
            }
            return duplicated;
          }
          """
          if old not in text:
              raise SystemExit('duplicateTournament pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify duplicate behavior
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { createTournament, duplicateTournament } from './src/domain/tournament.js';
          const source = { ...createTournament('設定測試', ['A','B','C','D','E','F','G','H'], 'swiss'), swissStage2Config: { advanceCount: 8, format: 'swiss', rounds: 4 } };
          const copy = duplicateTournament(source);
          assert.deepEqual(copy.swissStage2Config, source.swissStage2Config);
          assert.notEqual(copy.swissStage2Config, source.swissStage2Config);
          console.log('PASS duplicate Swiss stage2 config');
          NODE
      - run: node scripts/test-fast.mjs
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-stage2-duplicate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Swiss stage2 config in tournament copies"
          git push origin HEAD:feat/two-stage-swiss
