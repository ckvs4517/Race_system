name: Analyze schedule sync
on:
  push:
    branches: [v2/codebase-refactor]
permissions:
  contents: read
jobs:
  analyze:
    if: github.event.head_commit.message == 'Analyze main schedule additions for V2 sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2/codebase-refactor
          fetch-depth: 0
      - run: |
          git fetch origin main
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          main = subprocess.check_output(['git','show','origin/main:src/views/schedule.js'], text=True)
          pat = re.compile(r'(?m)^(?:export )?function\s+([A-Za-z0-9_]+)\s*\(')
          main_names = pat.findall(main)
          modules = sorted(Path('src/views/schedule').glob('*.js'))
          owned = {}
          all_v2=[]
          for p in modules:
              names=pat.findall(p.read_text())
              owned[p.name]=names
              all_v2 += names
          print('MAIN FUNCTIONS', len(main_names))
          print('\n'.join(main_names))
          print('\nV2 OWNERS')
          for f,names in owned.items(): print(f, ':', ', '.join(names))
          print('\nMAIN-ONLY')
          print('\n'.join(n for n in main_names if n not in all_v2))
          print('\nV2-ONLY')
          print('\n'.join(n for n in all_v2 if n not in main_names))
          PY
