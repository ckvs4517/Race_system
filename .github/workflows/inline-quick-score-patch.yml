name: Inline quick score patch

on:
  push:
    branches:
      - feat/inline-quick-score
    paths:
      - .github/workflows/inline-quick-score-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/inline-quick-score
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply inline quick score patch
        run: python3 scripts/tmp-inline-quick-score-patch.py
      - name: Project health
        run: node scripts/project-health.mjs
      - name: Focused quick score regression
        run: node tests/quick-score.test.mjs
      - name: Fast regression
        run: node scripts/test-fast.mjs
      - name: Full regression and browser flows
        run: node scripts/test-full.mjs --browser=required
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/core/quick-score.js src/main.js src/views/schedule.js src/styles/quick-score-inline.css tests/quick-score.test.mjs tests/full-flow.test.js
          git diff --cached --check
          git commit -m "Use inline quick score entry"
          git push origin HEAD:feat/inline-quick-score
