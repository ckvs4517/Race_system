name: Apply Stage 2 UX patch

on:
  push:
    branches: [feat/stage2-selection-and-standings]
    paths:
      - .github/workflows/apply-stage2-ux.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage2-selection-and-standings

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply Stage 2 patches
        run: |
          python3 scripts/apply-stage2-ux.py
          python3 scripts/apply-stage2-round-label.py
          python3 scripts/apply-stage2-test-fix.py
          python3 scripts/apply-stage2-share-label-fix.py

      - name: Validate project health
        run: node scripts/project-health.mjs

      - name: Run focused Swiss tests
        run: node tests/swiss.test.mjs

      - name: Run fast regression
        run: node scripts/test-fast.mjs

      - name: Run full Node regression and build
        run: node scripts/test-full.mjs

      - name: Test browser tournament flows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spin-league-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for test_page in tournament.test.html full-flow.test.html; do
            output="$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:8765/tests/${test_page}")"
            echo "$output"
            echo "$output" | grep -q 'PASS '
          done

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src worker tests/swiss.test.mjs
          git diff --cached --check
          git commit -m "Move Stage 2 format choice to qualification"
          git push origin HEAD:feat/stage2-selection-and-standings
