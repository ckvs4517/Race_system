name: Fix V2 schedule cross-module imports
on:
  push:
    branches: [v2/codebase-refactor]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Fix V2 schedule cross-module imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2/codebase-refactor
      - name: Export and import Stage 2 view helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/views/schedule/decision-panels.js'); s=p.read_text()
          old='function readSwissStage2Config(tournament) {'
          assert old in s
          s=s.replace(old,'export function readSwissStage2Config(tournament) {',1)
          p.write_text(s)
          p=Path('src/views/schedule/leaderboard.js'); s=p.read_text()
          anchor="import { escapeAttribute, escapeText } from './html-escape.js';\n"
          addition="import { readSwissStage2Config } from './decision-panels.js';\n"
          assert anchor in s and addition not in s
          s=s.replace(anchor,addition+anchor,1)
          p.write_text(s)
          PY
          node --check src/views/schedule/decision-panels.js
          node --check src/views/schedule/leaderboard.js
          node tests/swiss-replay-ranking-explanation.test.mjs
          node scripts/test-fast.mjs
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-v2-schedule-imports.yml
          git add src/views/schedule/decision-panels.js src/views/schedule/leaderboard.js
          git commit -m "Fix Stage 2 schedule module dependency"
          git push origin HEAD:v2/codebase-refactor
