name: Review Stage 2 round-robin tie-break

on:
  push:
    branches: [feat/stage2-selection-and-standings]
    paths:
      - .github/workflows/review-stage2-tiebreak.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage2-selection-and-standings
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Apply reviewed tie-break patch
        run: python3 scripts/apply-stage2-roundrobin-tiebreak.py
      - name: Project health
        run: node scripts/project-health.mjs
      - name: Focused Swiss regression
        run: node tests/swiss.test.mjs
      - name: Fast regression
        run: node scripts/test-fast.mjs
      - name: Full Node regression and build
        run: node scripts/test-full.mjs
      - name: Browser tournament flows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spin-league-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for test_page in tournament.test.html full-flow.test.html; do
            output="$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:8765/tests/${test_page}")"
            echo "$output"
            echo "$output" | grep -q 'PASS '
          done
      - name: Commit reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/formats/swiss.js src/views/schedule.js tests/swiss.test.mjs
          git diff --cached --check
          git commit -m "Generalize Stage 2 round-robin tie-break labels"
          git push origin HEAD:feat/stage2-selection-and-standings
