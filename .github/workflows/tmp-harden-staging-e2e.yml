name: Harden staging E2E diagnostics

on:
  push:
    branches: [v2/codebase-refactor]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Harden staging E2E diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2/codebase-refactor
          fetch-depth: 0
      - name: Patch staging runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-staging-browser-e2e.mjs')
          s = p.read_text()
          old = """  cdp?.close();\n  browser?.kill('SIGTERM');\n  if (profile) await rm(profile, { recursive: true, force: true });\n}\n"""
          new = """  cdp?.close();\n  browser?.kill('SIGTERM');\n  if (profile) await cleanupBrowserProfile(profile);\n}\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    if (state?.hasApp && /Spin League/i.test(state.title + ' ' + state.body)) return;\n    await delay(250);\n"""
          new = """    const accessText = `${state?.title || ''} ${state?.body || ''}`;\n    if (/Sign in required|Continue with ChatGPT|You're almost in|You’re almost in/i.test(accessText)) {\n      throw new Error('ChatGPT Sites 存取保護擋住 CI。請將 spin-league-test 的 Site access 設為 Public 後再執行 Staging E2E。');\n    }\n    if (state?.hasApp && /Spin League/i.test(accessText)) return;\n    await delay(250);\n"""
          assert old in s
          s = s.replace(old, new, 1)

          marker = """function delay(ms) {\n  return new Promise((resolve) => setTimeout(resolve, ms));\n}\n"""
          helper = """async function cleanupBrowserProfile(path) {\n  await delay(300);\n  for (let attempt = 0; attempt < 4; attempt += 1) {\n    try {\n      await rm(path, { recursive: true, force: true });\n      return;\n    } catch (error) {\n      if (!['ENOTEMPTY', 'EBUSY', 'EPERM'].includes(error?.code)) throw error;\n      await delay(250 * (attempt + 1));\n    }\n  }\n  // Chrome shutdown can leave transient lock files; profile cleanup must not mask the E2E result.\n  await rm(path, { recursive: true, force: true }).catch(() => {});\n}\n\n""" + marker
          assert marker in s
          s = s.replace(marker, helper, 1)
          p.write_text(s)
          PY
          node --check scripts/verify-staging-browser-e2e.mjs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-harden-staging-e2e.yml
          git add scripts/verify-staging-browser-e2e.mjs
          git commit -m "Clarify staging access wall failures"
          git push origin HEAD:v2/codebase-refactor
