name: Retry two-stage Swiss patch

on:
  push:
    branches: [feat/two-stage-swiss]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add retry stage2 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/two-stage-swiss
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: python3 scripts/apply-two-stage-swiss.py

      - name: Focused Swiss tests
        run: node tests/swiss.test.mjs

      - name: Fast regression suite
        run: node scripts/test-fast.mjs

      - name: Remove temporary runner files
        run: rm -f .github/workflows/apply-two-stage-swiss-retry.yml scripts/sitecustomize.py

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable two-stage Swiss flow"
          git push origin HEAD:feat/two-stage-swiss
