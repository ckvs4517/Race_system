# 每次推送／PR 都在 GitHub 雲端執行規則、瀏覽器、建置與產物檢查。
name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate project instructions and Sites identity
        run: node scripts/project-health.mjs

      - name: Run all Node tests and build
        run: node scripts/test-full.mjs

      - name: Test browser tournament flows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spin-league-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for test_page in tournament.test.html full-flow.test.html; do
            output="$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:8765/tests/${test_page}")"
            echo "$output"
            echo "$output" | grep -q 'PASS '
          done

      - name: Validate build structure
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/index.js
          test "$(wc -c < dist/server/index.js)" -gt 20000
          test -f dist/client/index.html
          test "$(wc -c < dist/client/index.html)" -gt 500
          test -f dist/client/src/main.js
          test -f dist/server/domain/tournament.js
          test -f dist/server/formats/registry.js
          test -f dist/.openai/hosting.json
          tar -cf spin-league-sites.tar dist

      - name: Save deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: spin-league-sites-${{ github.sha }}
          path: spin-league-sites.tar
          if-no-files-found: error
          retention-days: 14
