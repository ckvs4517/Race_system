name: Apply V2 phase 1 wiring

on:
  push:
    branches: [v2/codebase-refactor]

permissions:
  contents: write

jobs:
  wire-controllers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2/codebase-refactor

      - name: Refactor main entrypoint wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.js')
          source = path.read_text()

          source = source.replace("import { rosterPlayerMatches } from './core/roster-filter.js';\n", '')
          source = re.sub(
              r"import \{ createTournamentRecord, deleteTournamentRecord, executeTournamentAction, getPublicRegistration, getState, initializeStore, loadTournamentRegistrations, loginAdmin, logoutAdmin, mutateTournament, refreshTournament, refreshTournaments, replaceTournamentRecords, submitPublicRegistration, subscribe, updateRegistrationRecord, updateState, selectTournament, selectMatch, selectEditingTournament \} from './data/store\.js';",
              "import { getState, initializeStore, refreshTournament, refreshTournaments, selectEditingTournament, selectTournament, subscribe, updateState } from './data/store.js';",
              source,
          )
          source = source.replace("import { duplicateTournament, normalizeTournament, requiredSeedCount } from './domain/tournament.js';", "import { normalizeTournament } from './domain/tournament.js';")
          source = source.replace("import { exportShareCardAsPng } from './export/share-card-png.js';\n", '')
          source = source.replace("import { manageView, bindManage } from './views/manage.js';", "import { manageView } from './views/manage.js';")
          source = source.replace("import { bindControl, controlView } from './views/control.js';", "import { controlView } from './views/control.js';")
          source = source.replace("import { bindDataManagement, dataManagementView } from './views/data-management.js';", "import { dataManagementView } from './views/data-management.js';")
          source = source.replace("import { bindPublicRegistration, registrationView } from './views/registration.js';", "import { registrationView } from './views/registration.js';")
          source = source.replace("import { bindRegistrationAdmin, registrationAdminView } from './views/registration-admin.js';", "import { registrationAdminView } from './views/registration-admin.js';")
          source = source.replace("import { bindDrinkSelectionFields, drinkSelectionFields, readDrinkSelection } from './views/drink-fields.js';\n", '')
          anchor = "import { registrationAdminView } from './views/registration-admin.js';\n"
          additions = """import { bindControlController, logoutAndGoHome } from './features/control/controller.js';
          import { bindDataManagementController } from './features/data-management/controller.js';
          import {
            bindPublicRegistrationController,
            bindRegistrationAdminController,
            isScheduleRegistrationEntry,
            openRegistrationAdminFromSchedule,
            resetRegistrationNavigationContext,
            syncPublicRegistrationRoute,
          } from './features/registration/controller.js';
          import { bindScheduleController } from './features/schedule/controller.js';
          import { bindTournamentManagementController } from './features/tournament-management/controller.js';
          """
          if additions.strip() not in source:
              source = source.replace(anchor, anchor + additions)

          for line in [
              "let publicRegistrationState = { key: '', loading: false, data: null, error: '', success: false };\n",
              "let rosterUiState = { tournamentId: null, filter: 'all', query: '', removing: false, selected: new Set() };\n",
              "let tournamentListUiState = { tab: 'recent', query: '', year: 'all', format: 'all' };\n",
              "let registrationEntryContext = { source: 'navigation', tournamentId: null };\n",
              "let toastTimer = null;\n",
              "let scheduleScrollRestore = null;\n",
          ]:
              source = source.replace(line, '')

          def remove_function(text, name):
              matches = list(re.finditer(rf"(?m)^(?:async\s+)?function\s+{re.escape(name)}\s*\(", text))
              if not matches:
                  return text
              start = matches[0].start()
              open_brace = text.find('{', matches[0].end())
              if open_brace < 0:
                  raise RuntimeError(f'No opening brace for {name}')
              depth = 0
              i = open_brace
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 1
                  elif quote:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == quote:
                          quote = None
                  else:
                      if c == '/' and n == '/':
                          line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          block_comment = True
                          i += 1
                      elif c in ("'", '"', '`'):
                          quote = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in ' \t': end += 1
                              while end < len(text) and text[end] == '\n': end += 1
                              return text[:start] + text[end:]
                  i += 1
              raise RuntimeError(f'Unclosed function {name}')

          for name in [
              'showToast', 'registrationUrl', 'copyText', 'bindDataManagementEvents',
              'bindRegistrationAdminEvents', 'bindPublicRegistrationEvents', 'loadPublicRegistration',
              'registrationRouteParams', 'bindControlEvents', 'addTournament', 'bindManageEvents',
              'saveTournamentChanges', 'prepareRosterUi', 'applyRosterUi', 'bindTournamentListEvents',
              'applyTournamentListUi', 'shareRegistration', 'bindScheduleEvents', 'beginSwissQualifier',
              'beginSwissFinal', 'completeSwissByStandings', 'beginRoundRobinTieBreak', 'escapeText',
              'drawSeeds', 'randomizeBracket', 'beginTournament', 'deleteTournament', 'copyTournament',
              'replayMatch', 'completeMatch', 'completeForfeit', 'updateParticipantStatus',
          ]:
              source = remove_function(source, name)

          register_start = source.index("  if (route === 'register') {")
          schedule_start = source.index("  if (route === 'schedule') {", register_start)
          source = source[:register_start] + "  if (route === 'register') view = registrationView(syncPublicRegistrationRoute(requestRender));\n" + source[schedule_start:]

          source = source.replace(
              "      registrationEntryContext.source === 'schedule' && registrationEntryContext.tournamentId === state.registrationTournamentId,",
              "      isScheduleRegistrationEntry(state.registrationTournamentId),",
          )
          source = source.replace("if (route === 'manage' && state.isAdmin) bindManageEvents(state);", "if (route === 'manage' && state.isAdmin) bindTournamentManagementController(app, state);")
          source = source.replace("if (route === 'manage' && !state.isAdmin) bindControlEvents();", "if (route === 'manage' && !state.isAdmin) bindControlController(app);")
          source = source.replace("if (route === 'control') bindControlEvents();", "if (route === 'control') bindControlController(app);")
          source = source.replace("if (route === 'data' && state.isAdmin) bindDataManagementEvents(state);", "if (route === 'data' && state.isAdmin) bindDataManagementController(app, state, requestRender);")
          source = source.replace("if (route === 'data' && !state.isAdmin) bindControlEvents();", "if (route === 'data' && !state.isAdmin) bindControlController(app);")
          source = source.replace("if (route === 'registration' && state.isAdmin) bindRegistrationAdminEvents(state);", "if (route === 'registration' && state.isAdmin) bindRegistrationAdminController(app, state);")
          source = source.replace("if (route === 'registration' && !state.isAdmin) bindControlEvents();", "if (route === 'registration' && !state.isAdmin) bindControlController(app);")
          source = source.replace("if (route === 'register') bindPublicRegistrationEvents();", "if (route === 'register') bindPublicRegistrationController(app, requestRender);")
          source = source.replace("if (route === 'schedule') bindScheduleEvents(state);", "if (route === 'schedule') bindScheduleController(app, state, { requestRender, openRegistrationAdmin: openRegistrationAdminFromSchedule });")
          source = re.sub(
              r"\n  if \(route === 'schedule' && !state\.selectedMatch && scheduleScrollRestore\) \{.*?\n  \}",
              '',
              source,
              flags=re.S,
          )

          source = source.replace(
              "    if (button.dataset.route === 'registration') {\n      registrationEntryContext = { source: 'navigation', tournamentId: null };\n      updateState((current) => ({ ...current, registrationTournamentId: null, registrations: [] }));\n    }",
              "    if (button.dataset.route === 'registration') resetRegistrationNavigationContext();",
          )
          source = source.replace(
              "  app.querySelector('[data-action=\"logout-admin\"]')?.addEventListener('click', () => {\n    logoutAdmin();\n    navigate('home');\n  });",
              "  app.querySelector('[data-action=\"logout-admin\"]')?.addEventListener('click', () => logoutAndGoHome());",
          )

          path.write_text(source)

          schedule = Path('src/features/schedule/controller.js')
          s = schedule.read_text()
          s = s.replace('  bindTournamentLifecycle(root, state);', '  bindTournamentLifecycle(root, state, requestRender);')
          s = s.replace('function bindTournamentLifecycle(root, state) {', 'function bindTournamentLifecycle(root, state, requestRender) {')
          s = s.replace("  root.querySelector('[data-action=\"back-events\"]')?.addEventListener('click', () => {\n    selectTournament(null);\n    // Store selection update會觸發 render；保留顯式 navigation 狀態不變。\n  });", "  root.querySelector('[data-action=\"back-events\"]')?.addEventListener('click', () => {\n    selectTournament(null);\n    requestRender();\n  });")
          schedule.write_text(s)

          test = Path('tests/early-finish-lock.test.mjs')
          t = test.read_text()
          old = "const mainSource = await readFile(new URL('../src/main.js', import.meta.url), 'utf8');\nassert.match(mainSource, /tournament\\.status === '進行中' && match\\?\\.status === '可開始'/, '路由只在進行中且可開始時顯示正式記分板');\nassert.match(mainSource, /tournament\\.status !== '進行中' \\|\\| match\\.status !== '可開始'/, '同步後若賽事已結束會清除舊的記分選取狀態');"
          new = "const mainSource = await readFile(new URL('../src/main.js', import.meta.url), 'utf8');\nconst scheduleControllerSource = await readFile(new URL('../src/features/schedule/controller.js', import.meta.url), 'utf8');\nassert.match(mainSource, /tournament\\.status === '進行中' && match\\?\\.status === '可開始'/, '路由只在進行中且可開始時顯示正式記分板');\nassert.match(scheduleControllerSource, /tournament\\.status !== '進行中' \\|\\| match\\.status !== '可開始'/, '同步後若賽事已結束會清除舊的記分選取狀態');"
          if old not in t:
              raise RuntimeError('early-finish test anchor not found')
          test.write_text(t.replace(old, new))
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/v2-phase1-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire V2 feature controllers into app entrypoint"
          git push origin HEAD:v2/codebase-refactor
