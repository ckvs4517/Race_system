name: Apply Swiss feedback patch

on:
  push:
    branches: [fix/swiss-feedback-ranking-bye-points]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/swiss-feedback-ranking-bye-points

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply requested changes
        run: node scripts/apply-swiss-feedback-patch.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused Swiss regressions
        run: |
          node tests/swiss.test.mjs
          node tests/swiss-ranking.test.mjs
          node tests/format-matrix.test.mjs
          node tests/check-in.test.mjs
          node tests/event-info.test.mjs
          node tests/html-escaping.test.mjs

      - name: Run health and fast regression
        run: |
          npm run health
          node scripts/test-fast.mjs

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/ranking/swiss-ranking.js src/views/manage.js src/formats/swiss.js tests/swiss.test.mjs tests/swiss-ranking.test.mjs
          git diff --cached --check
          git commit -m "Fix Swiss ranking defaults and bye points"
          git push origin HEAD:fix/swiss-feedback-ranking-bye-points
